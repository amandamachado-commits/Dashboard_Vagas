<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · Controle de Vagas</title>
  <link rel="icon" type="image/png" href="/assets/bemobi-icone.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .tela-login {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background:
        radial-gradient(640px 420px at 12% -10%, rgba(152,132,255,.35), transparent 60%),
        radial-gradient(640px 420px at 110% 10%, rgba(64,15,242,.12), transparent 55%),
        var(--fundo);
    }
    .caixa-login {
      width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--borda);
      border-radius: 20px; padding: 40px 36px;
      box-shadow: 0 24px 60px -24px rgba(24, 35, 60, .22), 0 2px 8px rgba(24, 35, 60, .04);
    }
    .marca-login { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-bottom: 28px; text-align: center; }
    .logo-bemobi { height: 28px; width: auto; display: block; }
    .logo-bemobi[hidden] { display: none; }
    .logo-fallback {
      display: none; align-items: center; gap: 8px; font-size: 20px; font-weight: 500;
      color: var(--azul); letter-spacing: -0.02em;
    }
    .logo-fallback .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--lilas); }
    .marca-login h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; margin: 0; }
    .marca-login .sub { margin-top: 0; font-size: 13px; }
    .caixa-login form { display: flex; flex-direction: column; gap: 18px; }
    .caixa-login label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--texto2); font-weight: 500; }
    .caixa-login input {
      font: inherit; font-size: 15px; color: var(--texto); padding: 11px 14px;
      border: 1px solid var(--borda); border-radius: 10px; background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    .caixa-login input::placeholder { color: #9AA6C0; }
    .caixa-login input:focus {
      outline: none; border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(64, 15, 242, .14);
    }
    .caixa-login button {
      font: inherit; font-size: 15px; font-weight: 500; color: #fff; background: var(--azul);
      border: 0; border-radius: 10px; padding: 13px; cursor: pointer; margin-top: 4px;
      transition: background .15s, transform .05s;
    }
    .caixa-login button:hover:not(:disabled) { background: #320AC2; }
    .caixa-login button:active:not(:disabled) { transform: translateY(1px); }
    .caixa-login button:disabled { opacity: .6; cursor: wait; }
    .erro-login { color: var(--erro); font-size: 13px; min-height: 1.2em; margin: 0; }
  </style>
</head>
<body>
  <main class="tela-login">
    <div class="caixa-login">
      <div class="marca-login">
        <img class="logo-bemobi" src="/assets/bemobi-logo.png" alt="Bemobi"
             onerror="this.hidden = true; document.getElementById('logo-fallback').style.display = 'flex';">
        <span class="logo-fallback" id="logo-fallback"><span class="ponto"></span>bemobi</span>
        <div>
          <h1>Controle de Vagas</h1>
          <div class="sub">AgendaEdu · Gente e Gestão</div>
        </div>
      </div>
      <form id="form-login">
        <label>Usuário
          <input id="usuario" name="usuario" autocomplete="username" required autofocus placeholder="seu.usuario">
        </label>
        <label>Senha
          <input id="senha" name="senha" type="password" autocomplete="current-password" required placeholder="••••••••">
        </label>
        <p class="erro-login" id="erro" role="alert"></p>
        <button type="submit" id="entrar">Entrar</button>
      </form>
    </div>
  </main>
  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const botao = document.getElementById('entrar');
      const erro = document.getElementById('erro');
      botao.disabled = true; erro.textContent = '';
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            usuario: document.getElementById('usuario').value.trim(),
            senha: document.getElementById('senha').value,
          }),
        });
        if (resp.ok) { location.href = '/'; return; }
        const j = await resp.json().catch(() => ({}));
        erro.textContent = j.erro || 'Não foi possível entrar.';
      } catch {
        erro.textContent = 'Sem conexão. Tente de novo.';
      }
      botao.disabled = false;
    });
  </script>
</body>
</html>
